# ~/.config/hypr/hyprland.conf
#
# Starter config for: RTX 4060 Max-Q (nvidia-open, hybrid graphics),
# greetd/tuigreet, waybar, wofi, mako, hyprlock, hypridle
#
# Docs: https://wiki.hyprland.org/Configuring/
#

################
### MONITORS ###
################
# Auto-configure detected monitors at preferred resolution/refresh rate.
# Run `hyprctl monitors` after first login to see actual names (eDP-1, DP-1, etc.)
# and replace the wildcard with a specific line if you want manual control, e.g.:
# monitor = eDP-1,1920x1080@144,0x0,1
monitor = ,preferred,auto,1

###################
### NVIDIA ENVS ###
###################
env = LIBVA_DRIVER_NAME,nvidia
env = XDG_SESSION_TYPE,wayland
env = GBM_BACKEND,nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# Hybrid graphics (dGPU offload) — use `prime-run <app>` to force an app onto the Nvidia GPU
env = __NV_PRIME_RENDER_OFFLOAD,1
env = __VK_LAYER_NV_optimus,NVIDIA_only

bindl = , switch:on:Lid Switch, exec, systemctl suspend

# Cursor theme (adjust to whatever you have installed, e.g. Bibata-Modern-Classic)
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Terminal
env = Terminal, kitty

#####################
### AUTOSTART ###
#####################
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = /usr/lib/polkit-kde-authentication-agent-1 &
exec-once = wl-paste --watch cliphist store
exec-once =  hyprpaper

#############################
### INPUT / TOUCHPAD ###
#############################
input {
    kb_layout = se
    kb_variant = nodeadkeys
    kb_options = caps:swapescape
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

##################
### GENERAL ###
##################
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 6

    blur {
        enabled = true
        size = 4
        passes = 2
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 8, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, default
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

gesture = 3,horizontal, workspace

#############################
### NVIDIA-SPECIFIC PERF ###
#############################
# Prevents frame-drop/latency issues seen on Nvidia when apps request tearing
render {
    direct_scanout = false
}

debug {
    vfr = true
}

#####################
### KEYBINDINGS ###
#####################
$mainMod = ALT
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun

# Core
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, fullscreen,

# Focus movement (vim-style, like sway)
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Down, movefocus, d
bind = $mainMod, Up, movefocus, u

# Workspaces 1-10
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Drag windows with mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Make sure the folder exists (run once, or add to your startup)
exec-once = mkdir -p ~/Pictures/screenshots

# Screenshot region -> save to file AND copy to clipboard
bind = , Print, exec, grim -g "$(slurp)" - | tee ~/Pictures/screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

# Screenshot full screen -> save to file AND copy to clipboard
bind = SHIFT, Print, exec, grim - | tee ~/Pictures/screenshots/$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy

# Media/volume keys (requires playerctl + pamixer or wpctl)
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# Brightness (requires brightnessctl)
bindl = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

#####################
### WINDOW RULES ###
#####################

windowrule{
    name = suppress_maximize
    suppress_event = maximize
    match:class = .*
}
windowrule{
    name = float_pavucontorl
    float = on
    match:class = ^(pavucontrol)$
}
windowrule{
    name = float_nm_editor
    float=  on
    match:class = ^(m-connection-editor)$
}
windowrule = float 1, match:class ^(RuneLite)$

