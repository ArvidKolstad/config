# ~/.config/hypr/hyprlock.conf

background {
    monitor =
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
}

input-field {
    monitor =
    size = 250, 60
    outline_thickness = 3
    dots_size = 0.3
    outer_color = rgba(89b4faee)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = rgba(205, 214, 244, 1)
    font_size = 55
    position = 0, 100
    halign = center
    valign = center
}
